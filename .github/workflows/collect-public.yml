name: Collect public campus information
on:
  schedule:
    # Daily at 10:00 UTC+8. Delayed runs are checked again before school access.
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      exercise_fallback:
        description: 'Skip the primary fetch to verify real recovery on macOS (manual test only)'
        type: boolean
        default: false
permissions:
  contents: read
env:
  LSNU_ENFORCE_COLLECTION_WINDOW: '1'
concurrency:
  group: public-campus-information
  cancel-in-progress: false
jobs:
  window:
    name: Check daytime collection window
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    outputs:
      allowed: ${{ steps.window.outputs.allowed }}
    steps:
      - uses: actions/checkout@v4
      - name: Check actual start time
        id: window
        run: python3 scripts/collection_window.py
  primary:
    name: Collect on Ubuntu
    needs: window
    if: ${{ needs.window.outputs.allowed == 'true' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    outputs:
      recover: ${{ steps.health.outputs.recover }}
      has_snapshot: ${{ steps.health.outputs.has_snapshot }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/checkout@v4
        with:
          ref: public-knowledge
          path: public-data
      - name: Recheck time after runner setup
        id: window
        run: python scripts/collection_window.py --attempt-folder "$RUNNER_TEMP/attempt"
      - name: Record attempt mode
        if: ${{ steps.window.outputs.allowed == 'true' }}
        env:
          EXERCISE_FALLBACK: ${{ inputs.exercise_fallback || false }}
        run: |
          mkdir -p "$RUNNER_TEMP/attempt"
          python - <<'PY'
          import json, os
          from pathlib import Path
          mode = 'exercise_primary_unavailability' if os.environ['EXERCISE_FALLBACK'] == 'true' else 'live'
          (Path(os.environ['RUNNER_TEMP']) / 'attempt/attempt-mode.json').write_text(json.dumps({'mode': mode}) + '\n')
          PY
      - name: Collect official pages
        if: ${{ steps.window.outputs.allowed == 'true' && !inputs.exercise_fallback }}
        run: >-
          python scripts/collect_public.py
          --previous public-data/latest.json
          --output "$RUNNER_TEMP/attempt/snapshot.json"
          --report "$RUNNER_TEMP/attempt/collection-report.json"
          --summary "$GITHUB_STEP_SUMMARY"
      - name: Validate attempt and decide recovery
        id: health
        run: python scripts/collection_ci.py health --folder "$RUNNER_TEMP/attempt" --runner ubuntu
      - name: Keep primary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-attempt-ubuntu-${{ github.run_id }}
          path: ${{ runner.temp }}/attempt/
          if-no-files-found: error
          retention-days: 30
  fallback:
    name: Recover on macOS
    needs: primary
    if: ${{ needs.primary.result == 'success' && needs.primary.outputs.recover == 'true' }}
    runs-on: macos-14
    timeout-minutes: 20
    outputs:
      has_snapshot: ${{ steps.health.outputs.has_snapshot }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/checkout@v4
        with:
          ref: public-knowledge
          path: public-data
      - name: Recheck time before fallback collection
        id: window
        run: python scripts/collection_window.py --attempt-folder "$RUNNER_TEMP/attempt"
      - name: Collect from the same original public snapshot
        if: ${{ steps.window.outputs.allowed == 'true' }}
        run: >-
          python scripts/collect_public.py
          --previous public-data/latest.json
          --output "$RUNNER_TEMP/attempt/snapshot.json"
          --report "$RUNNER_TEMP/attempt/collection-report.json"
          --summary "$GITHUB_STEP_SUMMARY"
      - name: Validate recovery attempt
        id: health
        run: python scripts/collection_ci.py health --folder "$RUNNER_TEMP/attempt" --runner macos
      - name: Keep recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-attempt-macos-${{ github.run_id }}
          path: ${{ runner.temp }}/attempt/
          if-no-files-found: error
          retention-days: 30
  publish:
    name: Publish verified public snapshot
    needs: [primary, fallback]
    if: ${{ always() && needs.primary.result == 'success' && (needs.primary.outputs.has_snapshot == 'true' || needs.fallback.outputs.has_snapshot == 'true') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/checkout@v4
        with:
          ref: public-knowledge
          path: public-data
      - uses: actions/download-artifact@v4
        with:
          pattern: public-attempt-*-${{ github.run_id }}
          path: ${{ runner.temp }}/attempts/
      - name: Choose a validated actual observation
        run: >-
          python scripts/collection_ci.py select
          --primary "$RUNNER_TEMP/attempts/public-attempt-ubuntu-${{ github.run_id }}"
          --fallback "$RUNNER_TEMP/attempts/public-attempt-macos-${{ github.run_id }}"
          --output public-data/latest.json
          --report "$RUNNER_TEMP/collection-report.json"
          --summary "$GITHUB_STEP_SUMMARY"
      - name: Publish the public snapshot
        working-directory: public-data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- latest.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh official campus information snapshot'
            git push origin HEAD:public-knowledge
          fi
      - name: Keep final selection statistics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-collection-${{ github.run_id }}
          path: ${{ runner.temp }}/collection-report.json
          retention-days: 30
          if-no-files-found: warn
      - name: Require actual complete collection
        run: python scripts/collection_ci.py require-healthy --report "$RUNNER_TEMP/collection-report.json"
